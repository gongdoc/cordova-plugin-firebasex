buildscript {
    repositories {
        google()        
        maven {
            url "https://www.jitpack.io"
        }
        maven {
            url 'https://maven.google.com/'
        }
        mavenCentral()
        jcenter()
    }
    dependencies {
        // classpath "com.android.tools.build:gradle:${cordovaConfig.AGP_VERSION}"
        // 7.6.2x 7.3.3x 8.0.2x
        classpath "com.android.tools.build:gradle:8.1.1"
        classpath "com.google.gms:google-services:${cordovaConfig.GRADLE_PLUGIN_GOOGLE_SERVICES_VERSION}"
        classpath "com.google.firebase:firebase-crashlytics-gradle:2.8.1"
    }
}
repositories {
    mavenCentral()
    maven {
        url "https://maven.google.com"
    }
}

apply plugin: com.google.firebase.crashlytics.buildtools.gradle.CrashlyticsPlugin
android {
    buildTypes {
        debug {
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
        release {
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                unstrippedNativeLibsDir "obj/local"
                strippedNativeLibsDir "build/intermediates/jniLibs/release"
            }
        }
    }
}

cdvPluginPostBuildExtras.add({
    afterEvaluate {
        rootProject.subprojects {
            if (name == "app") {
                if (!plugins.hasPlugin('com.google.gms.google-services')) {
                    apply plugin: com.google.gms.googleservices.GoogleServicesPlugin
                }
            }
        }
    }
})

dependencies {
    def work_version = "2.8.1"
    implementation platform('com.google.firebase:firebase-bom:33.1.1')

    // (Java only)
    implementation "androidx.work:work-runtime:$work_version"

    // Kotlin + coroutines
    implementation "androidx.work:work-runtime-ktx:$work_version"

    // optional - RxJava2 support
    implementation "androidx.work:work-rxjava2:$work_version"

    // optional - GCMNetworkManager support
    implementation "androidx.work:work-gcm:$work_version"

    // optional - Test helpers
    androidTestImplementation "androidx.work:work-testing:$work_version"

    // optional - Multiprocess support
    implementation "androidx.work:work-multiprocess:$work_version"

    implementation 'com.google.firebase:firebase-common'
    implementation 'com.google.android.gms:play-services-measurement-api:22.0.2'
    implementation 'com.google.firebase:firebase-auth:23.0.0'
    implementation 'com.google.android.recaptcha:recaptcha:18.4.0'
    implementation 'com.google.firebase:firebase-firestore'
}